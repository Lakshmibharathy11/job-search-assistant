name: Job Monitor

on:
  schedule:
    # Tue & Wed only, 10:00 AM and 2:00 PM PST (17:00 & 21:00 UTC).
    # Tuesday/Wednesday are the highest-volume recruiter posting days
    # (post-Monday-planning-meeting batch); two runs catch the morning
    # batch and same-day updates. 4 runs/week total — quality over quantity.
    - cron: "0 17,21 * * 2,3"

  # Lets you click "Run workflow" in the GitHub Actions UI for testing
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the updated job_monitor.db back to the repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8      # hard kill-switch so a hung scrape doesn't drain budget

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Main run ────────────────────────────────────────────────────────────
      - name: Run job monitor
        env:
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:  ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER:    ${{ secrets.TWILIO_TO_NUMBER }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
        run: python job_monitor.py

      # ── Upload log for every run (7-day retention) ──────────────────────────
      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: job_monitor.log
          retention-days: 7

      # ── Persist the updated SQLite DB directly in the repo. This replaces the
      # previous actions/cache approach, which could silently fail to restore
      # or race under overlapping runs, wiping dedup history and causing
      # repeat notifications for jobs already seen.
      - name: Commit updated job database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_monitor.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: update job monitor DB [skip ci]"
            git push
          else
            echo "No DB changes to commit."
          fi
