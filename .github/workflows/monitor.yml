name: Job Monitor

on:
  schedule:
    # Fires every 20 minutes. The script's should_run_now() exits early
    # ~90% of the time, so actual compute stays well under 1,000 min/month.
    - cron: "*/20 * * * *"

  # Lets you click "Run workflow" in the GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8      # hard kill-switch so a hung scrape doesn't drain budget

    steps:
      # ── Restore the SQLite DB from cache so dedup + learning persist ───────
      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: job_monitor.db
          key: job-monitor-db-${{ github.run_id }}
          restore-keys: |
            job-monitor-db-

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Main run ────────────────────────────────────────────────────────────
      - name: Run job monitor
        env:
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:  ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER:    ${{ secrets.TWILIO_TO_NUMBER }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
        run: python job_monitor.py

      # ── Upload log for every run (7-day retention) ──────────────────────────
      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: job_monitor.log
          retention-days: 7

      # ── Persist updated SQLite DB ────────────────────────────────────────────
      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: job_monitor.db
          key: job-monitor-db-${{ github.run_id }}
