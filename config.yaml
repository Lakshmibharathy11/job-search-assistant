# ─────────────────────────────────────────────
# Job Monitor Preferences
# Edit this file to tune what jobs you see — no code changes needed.
# ─────────────────────────────────────────────

profile:
  education: master        # boosts jobs mentioning MS/Master's/Graduate
  min_score: 25             # lower = see more jobs; raise to be stricter

  # Skills used for profile-match scoring (tiered by weight in job_monitor.py)
  skills:
    tier1:  # Core AI/ML — 5 pts each, up to 40
      - python
      - machine learning
      - deep learning
      - pytorch
      - llm
      - rag
      - langchain
      - langgraph
      - generative ai
      - nlp
      - natural language processing
      - transformer
      - data science
      - scikit-learn
    tier2:  # Data & Engineering — 3 pts each, up to 25
      - sql
      - pandas
      - data analysis
      - airflow
      - dbt
      - snowflake
      - aws
      - docker
      - fastapi
      - kafka
      - postgresql
      - mongodb
      - etl
      - data pipeline
      - feature engineering
      - a/b testing
      - experimentation
    tier3:  # BI & Visualization — 2 pts each, up to 15
      - power bi
      - tableau
      - streamlit
      - dashboard
      - data visualization
      - matplotlib
      - analytics

# Roles actually targeted — kept tight to your stated focus:
# entry-level / new-grad AI Engineer, Data Scientist, Data Analyst only.
# Add more roles here later if you want to widen the net.
target_roles:
  - "ai engineer"
  - "applied ai engineer"
  - "genai engineer"
  - "gen ai engineer"
  - "data scientist"
  - "data science"
  - "data analyst"

# Maximum years of experience a posting may require. Postings requiring
# more than this are hard-blocked (see SENIOR_BLOCK in job_monitor.py).
experience:
  max_years: 1

